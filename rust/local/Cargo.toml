[package]
name = "local"
version = "0.1.0"
edition = "2021"
publish = false
links = "local"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
kv = { path = "../kv" }
cxx = "1"

[build-dependencies]
cxx-build = "1"

[target.'cfg(target_os = "linux")'.dependencies]
parquet = { version = "=57.3.1", default-features = false, features = ["snap", "flate2-zlib-rs", "zstd", "lz4"] }
